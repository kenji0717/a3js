<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="mobile-web-app-capable" content="yes">
    <title>gaha</title>
    <script type="importmap">
     {
       "imports": {
         "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.min.js",
         "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/",
         "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/+esm",
         "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm",
         "meshoptimizer": "https://unpkg.com/meshoptimizer@1.0.1/meshopt_decoder.module.js",
         "a3js": "../dist/a3js.es.js"
       }
     }
    </script>
    <!-- "a3js": "https://cdn.jsdelivr.net/npm/a3js@0.0.29/+esm" -->
    <style>
     html, body {
       margin: 0;
       padding: 0;
       overflow: hidden;
       height: 100%;
       touch-action: none;
     }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module">
import * as a3 from 'a3js';

const stk_kart = {
  mass: 10.0, // ブレーキの効きが悪いので、こちらで調節することにした
  chassisWidth: 0.7,
  chassisHeight: 0.5,
  chassisLength: 1.5,
  chassisOffset: {x:  0.0, y: -0.25,  z:  0.0 },
  wheelFrontYPosition: -0.05,
  wheelFrontZPosition: 0.40,
  wheelFrontAxleLength: 0.60,
  wheelRearYPosition: -0.00,
  wheelRearZPosition: -0.35,
  wheelRearAxleLength: 0.7,
  wheelFrontRadius: 0.1,
  wheelRearRadius: 0.15,
  wheelFrontWidth: 0.19,
  wheelRearWidth: 0.24,
  wheelFrontSuspensionRestLength: 0.26,
  wheelRearSuspensionRestLength: 0.25,
  wheelFrontSuspensionStiffness: 200.0, // ほとんど述び縮みしない設定
  wheelRearSuspensionStiffness: 250.0, // ほとんど述び縮みしない設定
  wheelFrontSuspensionCompression: 4.0,
  wheelRearSuspensionCompression: 4.0,
  wheelFrontSuspensionRelaxation: 10.0,
  wheelRearSuspensionRelaxation: 10.0,
  wheelFrontMaxSuspensionTravel: 0.05, // ほとんど述び縮みしない設定
  wheelRearMaxSuspensionTravel: 0.05, // ほとんど述び縮みしない設定
  aerodynamicDrag: 0.5 // 空気抵抗
};

await a3.initPhysics();
//const view = new a3.GameCanvas();
const view = new a3.GameCanvas({touchDevice:true});
document.querySelector('#game').appendChild(view);
await view.alert('START',async ()=>{
  await a3.initSound();
  view.requestFullscreen();
});

view.camera.setHeadLight(false);
const lights = new a3.StandardLights();
lights.setPosition(100,100,100);
view.scene.add(lights);
const ground = await new a3.Acerola3D('./assets/A3/supertuxkart/tracks/city/stk_city.a3').ready;
ground.setMode('SimplePhysics',{meshCollider:'tri_mesh',rigidBody:'fixed'});
view.scene.add(ground);

const obj = await new a3.Acerola3D('./assets/A3/supertuxkart/karts/tux/stk_tux.a3').ready;
const cc = new a3.CarControl(stk_kart);
obj.setTransformer(cc.trans);
obj.getAction('default').motion = cc.motion;
obj.setState('default');
view.scene.add(obj);
cc.reset(new a3.Vec3(0,1.0,0),new a3.Quat(0,1,0,0));

view.camera.setMode('Follow',{target: obj,lookFrom:{x:0,y:1,z:-3}});

while (true) {
  await view.waitForRender();
  cc.accelerator(view.leftJoystick.y*20);
  cc.handle(-view.leftJoystick.x*0.1);
  cc.brake(view.leftButton?100.0:0);
  if (view.rightButton)
    cc.reset(new a3.Vec3(0,0.1,0).add(obj.loc),new a3.Quat());
}
    </script>
  </body>
</html>
