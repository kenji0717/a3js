<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>gaha</title>
  </head>
  <body>
    <script type="importmap">
     {
       "imports": {
         "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.min.js",
         "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/",
         "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/+esm",
         "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm",
         "meshoptimizer": "https://unpkg.com/meshoptimizer@1.0.1/meshopt_decoder.module.js",
         "a3js": "../dist/a3js.es.js"
       }
     }
    </script>
    <!-- "a3js": "https://cdn.jsdelivr.net/npm/a3js@0.0.29/+esm" -->
    <script type="module">
import * as THREE from 'three';
import * as a3 from 'a3js';

const stk_kart = {
  mass: 100.0,
  chassisWidth: 0.7,
  chassisHeight: 0.5,
  chassisLength: 1.5,
  wheelFLPosition: {x:  0.30, y: -0.15,  z:  0.40 },
  wheelFRPosition: {x: -0.30, y: -0.15,  z:  0.40 },
  wheelRLPosition: {x:  0.35, y: -0.10,   z: -0.35 },
  wheelRRPosition: {x: -0.35, y: -0.10,   z: -0.35 },
  wheelFLRadius: 0.1,
  wheelFRRadius: 0.1,
  wheelRLRadius: 0.15,
  wheelRRRadius: 0.15,
  wheelFLWidth: 0.19,
  wheelFRWidth: 0.19,
  wheelRLWidth: 0.24,
  wheelRRWidth: 0.24,
  wheelFLSuspensionRestLength: 0.32,
  wheelFRSuspensionRestLength: 0.32,
  wheelRLSuspensionRestLength: 0.3,
  wheelRRSuspensionRestLength: 0.3,
  wheelFLSuspensionStiffness: 20.0,
  wheelFRSuspensionStiffness: 20.0,
  wheelRLSuspensionStiffness: 25.0,
  wheelRRSuspensionStiffness: 25.0,
  wheelFLSuspensionCompression: 4.0,
  wheelFRSuspensionCompression: 4.0,
  wheelRLSuspensionCompression: 4.0,
  wheelRRSuspensionCompression: 4.0,
  wheelFLSuspensionRelaxation: 10.0,
  wheelFRSuspensionRelaxation: 10.0,
  wheelRLSuspensionRelaxation: 10.0,
  wheelRRSuspensionRelaxation: 10.0
};

await a3.initPhysics();
//const oc = new THREE.OrthographicCamera(-2,2,1,-1,0.1,1000);
//const gc = new a3.GeneralCamera(oc);
//const view = new a3.Window(600,300,{camera:gc});
//const view = new a3.GameCanvas();
const view = new a3.GameCanvas({touchDevice:true});
view.scene.rapierDebug(true);
document.body.appendChild(view);
view.camera.setHeadLightEnable(false);
const lights = new a3.StandardLights();
lights.setLocation(100,100,100);
view.scene.add(lights);
const ground = await new a3.Acerola3D('./assets/A3/supertuxkart/tracks/city/stk_city.a3').ready;
ground.initSimplePhysics({meshCollider:'tri_mesh',rigidBody:'fixed'});
view.scene.add(ground);

const obj = await new a3.Acerola3D('./assets/A3/supertuxkart/karts/tux/stk_tux.a3').ready;
const cc = new a3.CarControl(stk_kart);
obj.setTransformer(cc.trans);
obj.getAction('default').motion = cc.motion;
obj.setState('default');
view.scene.add(obj);
cc.reset(new a3.Vec3(0,0.5,0));

view.scene.setAvatar(obj);
view.setController(new a3.FollowAvatarController({offset:{x:2,y:0,z:-1}}));
//view.setController(new a3.FollowAvatarController({offset:{x:0,y:1.5,z:-3}}));

while (true) {
  await view.waitForRender();
  cc.handle(-view.leftJoystick.x*0.1);
  cc.accelerator(view.leftJoystick.y*100);
  if (view.leftButton)
    cc.brake(100000);
  else
    cc.brake(0);
  if (view.rightButton)
    cc.reset(obj.loc);
}

    </script>
  </body>
</html>
