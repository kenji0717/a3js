<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>フライトシミュレーターのサンプル</title>
    <script type="importmap">
       {
         "imports": {
           "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.min.js",
           "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/",
           "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/+esm",
           "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm",
           "meshoptimizer": "https://unpkg.com/meshoptimizer@1.0.1/meshopt_decoder.module.js",
           "a3js": "https://cdn.jsdelivr.net/npm/a3js@0/+esm"
         }
       }
    </script>
    <!-- "a3js": "https://cdn.jsdelivr.net/npm/a3js@latest/+esm" -->
    <!-- "a3js": "https://cdn.jsdelivr.net/npm/a3js@0.0.60/+esm" -->
    <!-- "a3js": "./a3js/dist/a3js.es.js" -->
    <!-- "a3js": "../a3js/dist/a3js.es.js" -->
  </head>
  <body>
    <style>
     * {
       margin: 0;
     }
     html, body {
       overscroll-behavior: none;
     }
     #contents {
       height: 100vh;
       width: 100vw;
       display: flex;
       flex-direction: column;
     }
     #instructions {
       padding: 0.5em;
       flex-shrink: 0;
     }
     #base-div {
       position: relative;
       flex: 1;
     }
     #volume-div {
       display: none;
       position: absolute;
       width: 100%;
       margin: 100px auto;
       text-align: center;
       color: white;
       z-index: 100;
     }
     #display-div {
       display: none;
       position: absolute;
       top: 10px;
       left: 10px;
       color: red;
       z-index: 100;
     }
     game-canvas-a3 {
       position: absolute;
       top: 0;
       left: 0;
       width: 100%;
       height: 100%;
       /* touch-action: none; */
    }
    </style>
    <div id="contents">
      <div id="instructions">
        <p>PCではASDWとスペース、エンターのキーで操作して下さい。スマホでは画面に表示されるジョイスティックと"L"と"R"のボタンで操作して下さい。</p>
      </div>
      <div id="base-div">
        <div id="volume-div">
          <p>volume: <input id="volume" type="range" min="0" max="2" value="1" step="0.01"></p>
          <p>←→でもvolume調整可能</p>
          <p>PCならSpaceキー、スマホなら「L」ボタンで次へ</p>
        </div>
        <div id="display-div">
          <p>LIFE: <span id="life"></span></p>
          <p>SCORE: <span id="score"></span></p>
        </div>
      </div>
    </div>
    <script type="module">
     import * as a3 from 'a3js';

     // minからmaxの間の実数乱数を生成
     function rnd(min,max) {return min+(max-min)*Math.random();}
     // min(整数)以上max(整数)未満の整数乱数を生成
     function rndI(min,max) {return Math.floor(min+(max-min)*Math.random());}

     // ############################################################
     // 最初はクラス宣言
     // ############################################################

     // このゲーム用のAcerola3D
     class GameAcerola3D extends a3.Acerola3D {
       constructor(url,mode,opt) {
         super(url);
         this.ready.then(()=>{
           this.setMode(mode,opt);
         });
       }
     }

     // このゲーム用のGLTF
     class GameGLTF extends a3.GLTF {
       constructor(data,mode,opt) {
         super(data);
         this.ready.then(()=>{
           this.setMode(mode,opt);
         });
       }
     }

     class Player extends GameGLTF {
       life; // lifeが0になったらGame Over
       constructor() {
         super('../assets/Stork.glb','SimplePhysics',{rigidBody:'kinematic',collisionDetection:true});
         this.life = 100;
         this.setScaleNow(0.01,0.01,0.01); // 大きすぎるので0.01倍
       }
       async shoot() { // 弾丸発射
         const bullet = await new Bullet().ready;
         const p = this.getPosition();
         const f = this.getUnitVecZ();
         bullet.setPositionNow(p.add(f.scale(3)));
         bullet.setQuatNow(this.getQuat());
         se1.play();
         mainScene.add(bullet);
       }
       async update(dt) {
         super.update(dt);
         this.rollRightNow(3*view.leftJoystick.x);
         this.turnDownNow(view.leftJoystick.y);
         this.moveForwardNow(0.1);
         if (view.getRightButtonCount()>0) {
           await this.shoot();
         }
       }
       handleCollision(obj, started, myPartNo, yourPartNo) {
         //if (!started) return;
         if (obj instanceof Block) {
           this.life--;
           se2.play();
         }
       }
     }

     // 敵クラス
     class Enemy extends GameGLTF {
       urouro; // うろうろ成分

       constructor() {
         super('../assets/Parrot.glb','SimplePhysics',{rigidBody:'kinematic',collisionDetection:true})
         this.setScaleNow(0.1,0.1,0.1); // 大きさ縮小
         this.urouro = new a3.Vec3(rnd(-20,20),rnd(-20,20),rnd(-20,20)); // うろうろ成分
       }

       // 更新処理
       async update(dt) {
         super.update(dt);
         if (rnd(0,1)<0.01) // 1%の確率でうろうろ成分を変更
           this.urouro.set(rnd(-20,20),rnd(-20,20),rnd(-20,20));
         const target = player.getPosition(); // これから向う場所
         target.add(player.getUnitVecZ().scale(30));
         target.add(this.urouro);
         const p =  this.getPosition(); // 自分の現在の場所
         p.scale(0.97);
         target.scale(0.03);
         target.add(p); // 次のフレームまでに向う場所
         this.setPositionNow(target);
         this.setQuatNow(player.getQuat());
       }
       
       handleCollision(obj, started, myPartNo, yourPartNo) {
         //if (!started) return;
         if (obj instanceof Bullet) {
           enemyCount--;
           score += 100;
           mainScene.remove(this);
         }
       }
     }

     // 弾丸クラス
     class Bullet extends GameGLTF {
       life; // 0になったら消える
       constructor() {
         super('../assets/ball.glb','SimplePhysics',{rigidBody:'kinematic',collisionDetection:true});
         this.life = 100;
       }

       update(dt) {
         super.update(dt);
         this.life--;
         if (this.life<0) {
           mainScene.remove(this);
         }
         this.moveForwardNow(0.5);
       }
       handleCollision(obj, started, myPartNo, yourPartNo) {
         //if (!started) return;
         mainScene.remove(this);
       }
     }

     // ブロッククラス
     class Block extends GameAcerola3D {
       life; // 0になったら消える
       constructor() {
         super('../assets/ClearBlocks.a3','SimplePhysics',{rigidBody:'kinematic',collisionDetection:true});
         this.life = 400;
         this.setScaleNow(10,10,10);
       }

       update(dt) {
         super.update(dt);
         this.life--;
         if (this.life<0) {
           mainScene.remove(this);
         }
       }
       handleCollision(obj, started, myPartNo, yourPartNo) {
         // 特にすることなし。
       }
     }

     class SkyBox extends GameAcerola3D {
       constructor() {
         super('../assets/SkyBox01.a3','Default');
       }
     }

     class BGM extends a3.Sound {
       constructor(url) {
         super(url,{type:'sound',loop:true,volume:0.5});
       }
     }

     class SoundEffect extends a3.Sound {
       constructor(url) {
         super(url,{type:'sound',loop:false,volume:1.0});
       }
     }

     // ############################################################
     // 以下、実際にゲームの処理を行なう部分
     // ############################################################

     // a3.GameCanvasを生成。
     //const view = new a3.GameCanvas({touchDevice:true, width:'100%', height: '100%'});
     const view = new a3.GameCanvas({width:'100%', height: '100%'});
     view.camera.setHeadLight(false); // ヘッドライトOFF
     view.setController(new a3.BaseController()); // マウスでグリグリできなくする
     document.querySelector('#base-div').appendChild(view);

     // HTMLで用意してある要素を抽出
     const baseDiv = document.querySelector('#base-div');
     const volumeDiv = document.querySelector('#volume-div');
     const volume = document.querySelector('#volume');
     const displayDiv = document.querySelector('#display-div');
     const lifeSpan = displayDiv.querySelector('#life');
     const scoreSpan = displayDiv.querySelector('#score');

     // ページを開いた時に一度だけ初期化が必要な処理
     await a3.initPhysics(); // 物理演算初期化
     await a3.initFont('../assets/M-PLUS-1_Bold.json.zip'); // 3Dフォント初期化
     await view.alert('スマホプレイの時は横向き画面をお勧めします。',async ()=>{
       await a3.initSound(); // 音声の初期化
       if (baseDiv.requestFullscreen)
         baseDiv.requestFullscreen(); // 全画面表示
     });
     // ボリューム調整できるようにする
     volume.addEventListener('input',(e)=>{
       const v = volume.value;
       a3.Sound.listener.setMasterVolume(v);
     });
     // ゲームのシーン(≒画面)を3つ(start,maidend)用意
     const startScene = new a3.Scene(); // スタート画面
     const mainScene = new a3.Scene(); // メイン画面(とりあえず空)
     //mainScene.setPhysicsDebugMode(true); // GAHA 当り判定のデバッグON
     const clearScene = new a3.Scene(); // ゲームクリア画面
     const overScene = new a3.Scene(); // ゲームオーバー画面

     // ゲーム必要な変数や定数
     let time; // ゲーム内時間(秒)
     let score; // スコア
     const ENEMY_NUM = 3; // 敵の生成数
     let enemyCount; // 敵の残り数
     const lookFrom = {x:0, y:3, z:-5}; // Playerから見たカメラの位置

     let heavyInitFinished = false;
     // 先読みしておくゲーム内オブジェクトの変数
     let player; // プレーヤー
     let gameTitleTxt; // 文字1
     let gameClearTxt; // 文字2
     let gameOverTxt; // 文字3
     let bgm2; // BGM2
     let se1; // 効果音1
     let se2; // 効果音2
     let skybox; // スカイボックス
     let light; // ライト(光)
     async function heavyInit() {
       // 使い捨てしないゲームオブジェクトはここで作る
       if (heavyInitFinished) return; // すでに読み込み済みなら何もしない
       const loadings = [];
       loadings.push(new Player()); // プレーヤー
       loadings.push(new BGM('../assets/bgm_maoudamashii_8bit02.mp3')); // BGM2
       loadings.push(new SoundEffect('../assets/se_maoudamashii_onepoint01.wav')); // 効果音1
       loadings.push(new SoundEffect('../assets/se_maoudamashii_onepoint02.wav')); // 効果音2
       loadings.push(new SkyBox()); // スカイボックス
       [player,bgm2,se1,se2,skybox] = await Promise.all(loadings);
       // 重くない処理だけど1回やっとけばOKな初期化
       gameClearTxt = new a3.Text3D("Game Clear!",{color:0x0000ff});
       clearScene.add(gameClearTxt);
       clearScene.add(new a3.StandardLights());
       gameOverTxt = new a3.Text3D("Game Over!",{color:0xff0000});
       overScene.add(gameOverTxt);
       overScene.add(new a3.StandardLights());
       light = new a3.StandardLights(); // mainScene用
       light.setPositionNow(100,100,100);
       // 初期化が完了したことを記録
       heavyInitFinished = true;
     }
     // 以下はすぐ必要なやつ
     const bgm1 = await new BGM('../assets/bgm_maoudamashii_8bit01.mp3').ready; // BGM1
     gameTitleTxt = new a3.Text3D("フライトシミュレーター",{color:0x00ff00});
     startScene.add(gameTitleTxt);
     startScene.add(new a3.StandardLights());

     // ゲーム全体の無限ループ
     while (true) {
       await gameStart();
       await gameMain();
       if (enemyCount <= 0)
         await gameClear();
       else
         await gameOver();
     }

     // ゲームのスタート画面の処理
     async function gameStart() {
       volumeDiv.style.display = 'block';
       view.replaceScene(startScene);
       view.camera.setMode('Default');
       view.camera.setPosition(0,0,5);
       view.camera.lookAt(0,0,0);
       startScene.add(bgm1);
       bgm1.play();
       const p = heavyInit(); // このタイミングで初期化開始
       let v = Number(volume.value);
       while (true) {
         await view.waitForRender();
         gameTitleTxt.turnUp(1.0);
         if (view.rightJoystick.x !== 0) {
           v += 0.05*view.rightJoystick.x;
           v = Math.min(Math.max(0,v),2);
           volume.value = String(v);
           volume.dispatchEvent(new Event("input",{bubbles:true}));
         }
         if (view.getLeftButtonCount() > 0)
           break;
       }
       await p; // 初期化完全終了まで待つ
       bgm1.stop();
       startScene.remove(bgm1);
       volumeDiv.style.display = 'none';
     }

     // ゲームのメイン画面の処理
     async function gameMain() {
       await gameMainInit();
       await gameMainLoop();
       await gameMainCleanUp();
     }

     // ゲーム開始直前に毎回必要な初期化
     async function gameMainInit() {
       mainScene.add(bgm2);
       bgm2.play();
       mainScene.add(se1);
       mainScene.add(se2);
       mainScene.add(player);
       player.setPositionNow(0,0,0);
       player.setRotationNow(0,0,0);
       mainScene.add(skybox);
       mainScene.add(light);
       for (let i=0;i<ENEMY_NUM;i++) {
         const e = await new Enemy().ready;
         e.setState('Walking');
         mainScene.add(e);
       }
       view.replaceScene(mainScene);
       view.camera.setMode('Follow',{target:player,lookFrom:lookFrom});
       time = 0;
       score = 0;
       enemyCount = ENEMY_NUM;
       player.life = 100;
       displayDiv.style.display = 'block';
       // playerのマウスでの操作をセット
     }

     // ゲームのメインループ
     async function gameMainLoop() {
       while (true) {
         time += await view.waitForRender();
         lifeSpan.textContent = `${player.life}`;
         scoreSpan.textContent = `${score}`;
         // ↓上方向(特にカメラ)をplayerの上方向に合せる
         a3.ObjectA3.defaultUpVector.set(player.getUnitVecY());
         if (rnd(0,1)<0.03) { // 100分の3の確率でBlock生成
           const b = await new Block().ready;
           const pos = new a3.Vec3(rnd(-15,15),rnd(-15,15),rnd(-15,15));
           pos.add(player.getPosition());
           pos.add(player.getUnitVecZ().scale(30));
           b.setPositionNow(pos);
           mainScene.add(b);
         }
         // ゲーム終了の判定(色々な理由で終了する)
         if (enemyCount <= 0 || player.life <= 0)
           break;
       }
     }

     // ゲーム終了直後の後処理
     async function gameMainCleanUp() {
       // 次のゲームのために全部消す
       bgm2.stop();
       mainScene.removeAll();
       // 上方向をデフォルトにもどす
       a3.ObjectA3.defaultUpVector.set(0,1,0);
       displayDiv.style.display = 'none';
     }

     // ゲームクリア画面の処理
     async function gameClear() {
       document.exitPointerLock(); // Pointer Unlock
       view.replaceScene(clearScene);
       view.camera.setMode('Default');
       view.camera.setPosition(0,0,5);
       view.camera.lookAt(0,0,0);
       clearScene.add(bgm1);
       bgm1.play();
       volumeDiv.style.display = 'block';
       let v = Number(volume.value);
       while (true) {
         await view.waitForRender();
         gameClearTxt.turnUp(1.0);
         if (view.rightJoystick.x !== 0) {
           v += 0.05*view.rightJoystick.x;
           v = Math.min(Math.max(0,v),2);
           volume.value = String(v);
           volume.dispatchEvent(new Event("input",{bubbles:true}));
         }
         if (view.getLeftButtonCount() > 0)
           break;
       }
       volumeDiv.style.display = 'none';
       bgm1.stop();
       clearScene.remove(bgm1);
     }

     // ゲームオーバー画面の処理
     async function gameOver() {
       view.replaceScene(overScene);
       view.camera.setMode('Default');
       view.camera.setPosition(0,0,5);
       view.camera.lookAt(0,0,0);
       overScene.add(bgm1);
       bgm1.play();
       volumeDiv.style.display = 'block';
       let v = Number(volume.value);
       while (true) {
         await view.waitForRender();
         gameOverTxt.turnUp(1.0);
         if (view.rightJoystick.x !== 0) {
           v += 0.05*view.rightJoystick.x;
           v = Math.min(Math.max(0,v),2);
           volume.value = String(v);
           volume.dispatchEvent(new Event("input",{bubbles:true}));
         }
         if (view.getLeftButtonCount() > 0)
           break;
       }
       volumeDiv.style.display = 'none';
       bgm1.stop();
       overScene.remove(bgm1);
     }
    </script>
  </body>
</html>
